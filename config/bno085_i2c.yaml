bno08x_driver:
  ros__parameters:

    frame_id: "bno085"  # The frame_id to use for the sensor data

    # Communication Interface
    # Select the communication interface to use
    # (only one interface can be enabled at a time)
    # This requires a hardware change to the board
    # (see documentation for more information)
    i2c:
      enabled: true
      bus: "/dev/i2c-7"
      address: "0x4A"

    calibration:
      auto_save: true   # persist learned calibration to flash on every calibration update

    tare:
      # Quaternion [x, y, z, w] used by /imu/set_reorientation.
      # Set this parameter then call the service to apply a fixed reorientation.
      # Identity (no rotation) by default.
      quaternion: [0.0, 0.0, 0.0, 1.0]

    publish:
      magnetic_field:
        enabled: true
        rate: 100   # max 100 Hz
      game_rotation_vector:
        enabled: false  # set true to publish /imu/game_rotation (accel + gyro only, no magnetometer)
        rate: 100
      geomagnetic_rotation_vector:
        enabled: false  # set true to publish /imu/geomagnetic (accel + magnetometer only, no gyro)
        rate: 100
      significant_motion:
        enabled: false  # set true to publish /imu/significant_motion on first motion after stillness
      imu:
        enabled: true
        rate: 100   # max 400 Hz (anything above 100Hz depends on your hardware)
        linear_acceleration_compensated: true  # true: gravity-compensated (SH2_LINEAR_ACCELERATION), false: raw including gravity (SH2_ACCELEROMETER)
        orientation_covariance: [3.73e-3, 0.0, 0.0,
                                 0.0, 3.73e-3, 0.0,
                                 0.0, 0.0, 3.73e-3]
        gyrometer_covariance:   [2.93e-3, 0.0, 0.0,
                                 0.0, 2.93e-3, 0.0,
                                 0.0, 0.0, 2.93e-3]
        linear_covariance:      [0.1225, 0.0, 0.0,
                                 0.0, 0.1225, 0.0,
                                 0.0, 0.0, 0.1225]
